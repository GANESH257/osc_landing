<div style="background-color: #e9e9e9; padding: 60px 10px">
    <div style="background-color: #fff; color: #666; font-family: Arial,Helvetica,sans-serif; font-size: 14px; margin: 0 auto; width: 750px; max-width:100%; box-shadow: 0 0 10px rgba(0,0,0,0.3);">
        <div style="border-bottom: 1px solid #f1f1f1; margin-bottom: 30px; padding: 30px 20px; overflow:hidden;background-color: #fff;">
            <a href="[site-link]" style="float:left;"><img src="[site-link]assets/images/logo.png" style="border:none;" /></a>
        </div>
        <div style="padding:10px 20px;">
            <h1 style="margin:0px; margin-bottom:20px; color:#000; font-weight:normal;">[subject]</h1>
            [content]
        </div>
        <div style="border-top: 1px solid #f1f1f1; margin-top: 45px; padding: 25px 0; text-align: center;">
            &copy; [year] All Rights Reserved by [site-link].
        </div>
    </div>
</div>
