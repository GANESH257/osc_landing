<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brochure Download Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            max-width: 600px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input, textarea, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <!-- Netlify Form for Brochure Download -->
        <form name="brochure-download" method="POST" data-netlify="true" netlify-honeypot="bot-field">
            <input type="hidden" name="form-name" value="brochure-download" />
            <p class="hidden">
                <label>Don't fill this out if you're human: <input name="bot-field" /></label>
            </p>
            
            <div class="form-group">
                <label for="formGroupExampleInput1">Your Name <span class="text-danger">*</span></label>
                <input type="text" id="formGroupExampleInput1" name="name" required placeholder="Your Name">
            </div>

            <div class="form-group">
                <label for="formGroupExampleInput2">Phone <span class="text-danger">*</span></label>
                <input type="text" id="formGroupExampleInput2" name="phone" required placeholder="Phone Number">
            </div>

            <div class="form-group">
                <label for="formGroupExampleInput3">Email <span class="text-danger">*</span></label>
                <input type="email" id="formGroupExampleInput3" name="email" required placeholder="Email" pattern="^([a-zA-Z0-9_\-\.]+)@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.)|(([a-zA-Z0-9\-]+\.)+))([a-zA-Z]{2,4}|[0-9]{1,3})(\]?)$">
            </div>

            <div class="form-group">
                <button type="submit">Download Brochure</button>
            </div>
        </form>
    </div>
</body>
</html>
